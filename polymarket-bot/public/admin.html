<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Bot — Admin</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #1c2128; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --muted: #6e7681;
    --green: #3fb950; --red: #f85149; --blue: #58a6ff; --yellow: #d29922;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg2);
  }
  .logo { font-size: 18px; font-weight: 700; }
  .logo span { color: var(--blue); }
  .header-actions { display: flex; gap: 8px; }

  .btn {
    padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--bg3);
    color: var(--text); font-family: inherit; transition: 0.15s;
  }
  .btn:hover { border-color: var(--dim); }
  .btn-green { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-red { background: var(--red); color: #fff; border-color: var(--red); }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px; padding: 20px 24px;
  }

  .stat-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px;
  }
  .stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-card .value { font-size: 24px; font-weight: 700; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red { color: var(--red); }
  .stat-card .sub { font-size: 11px; color: var(--dim); margin-top: 4px; }

  .section {
    margin: 0 24px 20px; background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .section-header {
    padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13px;
    font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px;
    display: flex; justify-content: space-between; align-items: center;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 16px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 16px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 700;
  }
  .badge-yes { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge-no { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge-filled { background: rgba(88,166,255,0.15); color: var(--blue); }
  .badge-error { background: rgba(248,81,73,0.15); color: var(--red); }

  .empty { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }

  .config-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 8px; padding: 16px;
  }
  .config-item { font-size: 13px; }
  .config-item .k { color: var(--muted); }
  .config-item .v { color: var(--text); font-weight: 600; }

  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  .refresh-indicator {
    font-size: 11px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span>Polymarket</span> Bot <span style="color:var(--yellow);font-size:12px;font-weight:600">ADMIN</span></div>
  <div class="refresh-indicator">
    <div class="dot" id="liveDot"></div>
    <span id="lastUpdate">--</span>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="triggerScan()">Scan Now</button>
    <button class="btn" onclick="triggerRebalance()">Rebalance</button>
    <button class="btn btn-red" onclick="stopBot()">Stop</button>
    <button class="btn btn-green" onclick="startBot()">Start</button>
  </div>
</div>

<!-- Stats -->
<div class="grid" id="statsGrid">
  <div class="stat-card">
    <div class="label">Realized P&L</div>
    <div class="value" id="pnlValue">$0.00</div>
  </div>
  <div class="stat-card">
    <div class="label">Invested</div>
    <div class="value" id="investedValue">$0.00</div>
  </div>
  <div class="stat-card">
    <div class="label">Open Positions</div>
    <div class="value" id="positionsValue">0</div>
  </div>
  <div class="stat-card">
    <div class="label">Trades Placed</div>
    <div class="value" id="tradesValue">0</div>
  </div>
  <div class="stat-card">
    <div class="label">Scans</div>
    <div class="value" id="scansValue">0</div>
    <div class="sub" id="lastScanSub">--</div>
  </div>
  <div class="stat-card">
    <div class="label">Errors</div>
    <div class="value" id="errorsValue">0</div>
  </div>
</div>

<!-- Config -->
<div class="section">
  <div class="section-header">Configuration</div>
  <div class="config-grid" id="configGrid"></div>
</div>

<!-- Positions -->
<div class="section">
  <div class="section-header">
    <span>Open Positions</span>
    <span id="posCount" style="font-size:12px">0</span>
  </div>
  <div id="positionsTable"></div>
</div>

<!-- Trade Log -->
<div class="section">
  <div class="section-header">
    <span>Trade Log</span>
    <span id="tradeCount" style="font-size:12px">0</span>
  </div>
  <div id="tradeLogTable"></div>
</div>

<script>
  async function fetchStatus() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      render(data);
    } catch (err) {
      console.error('Fetch failed:', err);
    }
  }

  function render(data) {
    // Stats
    const pnl = data.pnl || 0;
    const pnlEl = document.getElementById('pnlValue');
    pnlEl.textContent = `${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}`;
    pnlEl.className = `value ${pnl >= 0 ? 'green' : 'red'}`;

    document.getElementById('investedValue').textContent = `$${(data.totalInvested || 0).toFixed(2)}`;
    document.getElementById('positionsValue').textContent = (data.positions || []).length;
    document.getElementById('tradesValue').textContent = data.stats?.tradesPlaced || 0;
    document.getElementById('scansValue').textContent = data.stats?.scans || 0;
    document.getElementById('errorsValue').textContent = data.stats?.errors || 0;

    if (data.stats?.lastScan) {
      document.getElementById('lastScanSub').textContent = `Last: ${new Date(data.stats.lastScan).toLocaleTimeString()}`;
    }

    // Config
    if (data.config) {
      const c = data.config;
      document.getElementById('configGrid').innerHTML = `
        <div class="config-item"><span class="k">Strategy:</span> <span class="v">${c.strategy}</span></div>
        <div class="config-item"><span class="k">Trade size:</span> <span class="v">$${c.tradeAmount}</span></div>
        <div class="config-item"><span class="k">Max positions:</span> <span class="v">${c.maxPositions}</span></div>
        <div class="config-item"><span class="k">Max per position:</span> <span class="v">$${c.maxPositionSize}</span></div>
        <div class="config-item"><span class="k">Min edge:</span> <span class="v">${(c.minEdge * 100).toFixed(0)}%</span></div>
      `;
    }

    // Positions
    const positions = data.positions || [];
    document.getElementById('posCount').textContent = positions.length;
    if (positions.length === 0) {
      document.getElementById('positionsTable').innerHTML = '<div class="empty">No open positions</div>';
    } else {
      document.getElementById('positionsTable').innerHTML = `
        <table>
          <tr><th>Market</th><th>Side</th><th>Size</th><th>Entry</th><th>Edge</th><th>Time</th></tr>
          ${positions.map(p => `
            <tr>
              <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.question)}</td>
              <td><span class="badge badge-${p.side}">${p.side.toUpperCase()}</span></td>
              <td>${parseFloat(p.size).toFixed(2)}</td>
              <td>${parseFloat(p.avgPrice).toFixed(3)}</td>
              <td>${(p.edge * 100).toFixed(1)}%</td>
              <td style="color:var(--muted)">${new Date(p.entryTime).toLocaleTimeString()}</td>
            </tr>
          `).join('')}
        </table>
      `;
    }

    // Trade log
    const trades = data.tradeLog || [];
    document.getElementById('tradeCount').textContent = trades.length;
    if (trades.length === 0) {
      document.getElementById('tradeLogTable').innerHTML = '<div class="empty">No trades yet</div>';
    } else {
      document.getElementById('tradeLogTable').innerHTML = `
        <table>
          <tr><th>Time</th><th>Market</th><th>Side</th><th>Price</th><th>Size</th><th>Amount</th><th>Edge</th><th>Status</th></tr>
          ${trades.map(t => `
            <tr>
              <td style="color:var(--muted);white-space:nowrap">${new Date(t.time).toLocaleTimeString()}</td>
              <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.question)}</td>
              <td><span class="badge badge-${(t.side||'').includes('yes') ? 'yes' : 'no'}">${(t.side||'').toUpperCase()}</span></td>
              <td>${parseFloat(t.price).toFixed(3)}</td>
              <td>${t.size}</td>
              <td>$${parseFloat(t.amount).toFixed(2)}</td>
              <td>${t.edge}</td>
              <td><span class="badge badge-${t.status}">${t.status}${t.pnl ? ' ' + t.pnl : ''}</span></td>
            </tr>
          `).join('')}
        </table>
      `;
    }

    document.getElementById('lastUpdate').textContent = `Updated ${new Date().toLocaleTimeString()}`;
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  // Get admin key from URL query param
  const adminKey = new URLSearchParams(window.location.search).get('key') || '';

  function adminFetch(url, opts = {}) {
    opts.headers = { ...(opts.headers || {}), 'X-Admin-Key': adminKey };
    return fetch(url, opts);
  }

  async function triggerScan() {
    await adminFetch('/api/scan', { method: 'POST' });
    fetchStatus();
  }

  async function triggerRebalance() {
    await adminFetch('/api/rebalance', { method: 'POST' });
    fetchStatus();
  }

  async function stopBot() {
    await adminFetch('/api/stop', { method: 'POST' });
    document.getElementById('liveDot').style.background = 'var(--red)';
  }

  async function startBot() {
    await adminFetch('/api/start', { method: 'POST' });
    document.getElementById('liveDot').style.background = 'var(--green)';
  }

  // Poll every 10s
  fetchStatus();
  setInterval(fetchStatus, 10000);
</script>
</body>
</html>
